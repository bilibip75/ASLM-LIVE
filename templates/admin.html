<html>
	<head>
		<meta charset='utf-8'>
			<link rel='stylesheet' href='/static/style.css'/>
			<body>
				<img class='logo' src='/static/logo_aslm.png'>
					<div class='menu'>
						<a class='btn' href='/'>🏠 Accueil</a>
						<a class='btn' href='/buteurs'>🏆 Buteurs</a>
					</div>
					<div class='card'>
						<h2>Nouveau match</h2>
						<form action='/create' method='post'>
							<select name='equipe'>{% for e in equipes %}<option>{{e}}</option>{% endfor %}</select>
							<input name='adversaire' placeholder='Adversaire'>
								<select name='domicile'>
									<option>Domicile</option>
									<option>Exterieur</option>
								</select>
								<input name='stade' placeholder='Stade'>
									<input type='date' name='date_match'>
										<input type='time' name='heure_match'>
											<button>Créer</button>
										</form>
									</div>{% for m in matchs %}<div class='card'>
										<a href='/match/{{m[0]}}'>⚽ {{m[1]}} - {{m[2]}}</a>
										<br>Score {{m[7]}}-{{m[8]}} | {{m[9]}}<br>
												<a href='/edit/{{m[0]}}'>✏️ Modifier</a> | <a href='/confirm_delete/{{m[0]}}'>🗑️ Supprimer</a>
											</div>{% endfor %}</body>
									</html>
